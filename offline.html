<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827"><title>QUICK CITY — Offline Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#fff;font-family:Arial,system-ui}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none}
.box{background:#111827dd;border:1px solid #ffffff33;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.5}
#title{font-size:14px;font-weight:900}#notice{position:fixed;top:76px;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;background:#111827e8;border:1px solid #facc15;border-radius:20px;padding:8px 13px;font-size:12px}
#pad{position:fixed;left:10px;bottom:12px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:4px}
button{touch-action:none;border:1px solid #ffffff66;border-radius:11px;background:#26364ddd;color:white;font-weight:bold}
.dir{font-size:18px}.blank{visibility:hidden}
#act{position:fixed;right:12px;bottom:14px;width:82px;height:52px;background:#087f72}
#pedals{position:fixed;right:104px;bottom:14px;display:flex;gap:4px}
.pedal{height:52px;width:52px;font-size:10px}#gas{background:#a64d0b}
#hint{position:fixed;bottom:115px;left:10px;font-size:10px;color:#dbeafe;background:#111827aa;padding:6px 8px;border-radius:8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div class="box"><div id="title">🌆 QUICK CITY — OFFLINE</div>Single-player • No internet required</div><div class="box" style="text-align:right">₦<span id="money">0</span><br><span id="mode">ON FOOT</span></div></div>
<div id="notice">Offline edition ready. Explore the city and find a car!</div>
<div id="hint">WASD / arrows move • Shift run • E enter/exit • Space brake</div>
<div id="pad"><button class="dir blank"></button><button class="dir" data-k="up">▲</button><button class="dir blank"></button><button class="dir" data-k="left">◀</button><button class="dir" data-k="down">▼</button><button class="dir" data-k="right">▶</button></div>
<div id="pedals"><button class="pedal" id="brake">BRAKE</button><button class="pedal" id="gas">GAS</button></div>
<button id="act">ACTION<br>E</button>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d'),notice=document.getElementById('notice');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const keys={},touch={};let player={x:0,y:0,dir:0},mode='walk',car=null,cash=0,mission=0,walk=0;
const cars=[{x:-100,y:55,color:'#d83e32',name:'Red Sedan',speed:0},{x:100,y:-70,color:'#2864c4',name:'Blue SUV',speed:0},{x:40,y:180,color:'#e9bd2e',name:'Yellow Taxi',speed:0}];
const blocks=[];
for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++){if(x===0||y===0)continue;blocks.push({x:x*190+(x>0?-25:25),y:y*190+(y>0?-25:25),w:85+(Math.abs(x*7+y*3)%3)*18,h:70+(Math.abs(x*3-y*9)%3)*17,color:['#bfa17c','#aab6b0','#c8bba4','#8fa2a8'][Math.abs(x*3+y*5)%4],name:['CORNER SHOP','LAGOS CAFE','CITY MARKET'][Math.abs(x+y)%3]})}
let target={x:0,y:-320};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function project(x,y,z=0){let scale=1;return {x:W/2+(x-player.x)*.78+(y-player.y)*.38,y:H*.52+(y-player.y)*.27-(x-player.x)*.16-z}}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill()}
function drawBuilding(b){let p=project(b.x,b.y),w=b.w*.78,h=b.h*.38,depth=23;
 poly([{x:p.x-w/2,y:p.y-h/2},{x:p.x-w/2+depth,y:p.y-h/2-depth},{x:p.x+w/2+depth,y:p.y-h/2-depth},{x:p.x+w/2,y:p.y-h/2}], '#65717a');
 poly([{x:p.x-w/2,y:p.y-h/2},{x:p.x+w/2,y:p.y-h/2},{x:p.x+w/2,y:p.y+h/2},{x:p.x-w/2,y:p.y+h/2}],b.color);
 poly([{x:p.x+w/2,y:p.y-h/2},{x:p.x+w/2+depth,y:p.y-h/2-depth},{x:p.x+w/2+depth,y:p.y+h/2-depth},{x:p.x+w/2,y:p.y+h/2}], '#77766c');
 ctx.fillStyle='#4b392d';ctx.fillRect(p.x-7,p.y+5,14,22);
 ctx.fillStyle='#e7e0c7';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText(b.name,p.x,p.y-h/2+12);
}
function drawCar(v,isPlayer=false){let p=project(v.x,v.y,5);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.28);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,14,22,9,0,0,7);ctx.fill();ctx.fillStyle=v.color;ctx.beginPath();ctx.roundRect(-20,-15,40,31,7);ctx.fill();ctx.fillStyle='#8db9c7';ctx.fillRect(-12,-12,24,12);ctx.fillStyle='#242a30';ctx.fillRect(-17,7,34,7);ctx.fillStyle='#fff0b3';ctx.fillRect(-17,-13,6,4);ctx.fillRect(11,-13,6,4);if(isPlayer){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-22,-17,44,35)}ctx.restore()}
function drawPerson(){let p=project(player.x,player.y,12);ctx.fillStyle='#1117';ctx.beginPath();ctx.ellipse(p.x,p.y+10,9,4,0,0,7);ctx.fill();ctx.fillStyle='#1d4ed8';ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill();ctx.fillStyle='#98613f';ctx.beginPath();ctx.arc(p.x,p.y-10,5,0,7);ctx.fill()}
function draw(){
 ctx.fillStyle='#8ab9d0';ctx.fillRect(0,0,W,H);
 // distant skyline
 for(let i=0;i<14;i++){let x=i*W/12;let bh=40+(i*31%90);ctx.fillStyle=['#80949a','#9a9b8c','#71858b'][i%3];ctx.fillRect(x,H*.3-bh,35,bh)}
 ctx.fillStyle='#668553';ctx.fillRect(0,H*.3,W,H*.7);
 // roads
 for(let i=-4;i<=4;i++){let a=project(i*190,-1200),b=project(i*190,1200);ctx.strokeStyle='#353b42';ctx.lineWidth=42;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#e8ddb5';ctx.lineWidth=1.5;ctx.setLineDash([14,12]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}
 for(let j=-4;j<=4;j++){let a=project(-1200,j*190),b=project(1200,j*190);ctx.strokeStyle='#353b42';ctx.lineWidth=42;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#e8ddb5';ctx.lineWidth=1.5;ctx.setLineDash([14,12]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}
 blocks.slice().sort((a,b)=>a.y-b.y).forEach(drawBuilding);
 // palm trees
 for(let i=0;i<16;i++){let x=(i%4-1.5)*250+100,y=(Math.floor(i/4)-1.5)*260+40,p=project(x,y);ctx.strokeStyle='#74543a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-23);ctx.stroke();ctx.strokeStyle='#286b3b';ctx.lineWidth=3;for(let q=-2;q<=2;q++){ctx.beginPath();ctx.moveTo(p.x,p.y-22);ctx.lineTo(p.x+q*9,p.y-30-Math.abs(q)*2);ctx.stroke()}}
 cars.forEach(v=>drawCar(v,mode==='drive'&&v===car));
 let m=project(target.x,target.y);ctx.strokeStyle='#ffe24a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(m.x,m.y,13,0,7);ctx.stroke();ctx.fillStyle='#fff4a8';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('DESTINATION',m.x,m.y-22);
 if(mode==='walk')drawPerson();
 // simple interior view
 if(mode==='interior'){ctx.fillStyle='#252e38';ctx.fillRect(W*.22,H*.2,W*.56,H*.55);ctx.fillStyle='#b69b7b';ctx.fillRect(W*.25,H*.25,W*.5,H*.45);ctx.fillStyle='#533b2b';ctx.fillRect(W*.47,H*.53,45,90);ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText('WELCOME INSIDE',W/2,H*.3)}
}
function nearBlock(){return blocks.find(b=>Math.abs(player.x-b.x)<b.w/2+25&&Math.abs(player.y-(b.y+b.h/2))<40)}
function action(){
 if(mode==='interior'){mode='walk';notice.textContent='You stepped back outside.';return}
 if(mode==='drive'){mode='walk';player.x=car.x+35;player.y=car.y;car=null;notice.textContent='You exited the car.';return}
 let found=cars.find(v=>dist(player,v)<58);
 if(found){car=found;mode='drive';notice.textContent='Driving '+car.name+'. Use GAS and steering controls. Press E to exit.';return}
 let b=nearBlock();if(b){mode='interior';notice.textContent='You entered the '+b.name+'. Press E to leave.';return}
 notice.textContent='Move closer to a parked car or building, then press E.';
}
document.getElementById('act').onclick=action;
addEventListener('keydown',e=>{let map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',Shift:'run',' ':'brake'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}if(e.key.toLowerCase()==='e'&&!e.repeat)action()});
addEventListener('keyup',e=>{let map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',Shift:'run',' ':'brake'};if(map[e.key])keys[map[e.key]]=false});
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>touch[k]=false))});
for(let [id,k] of [['gas','gas'],['brake','brake']]){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>touch[k]=false))}
function on(k){return !!(keys[k]||touch[k])}
let last=0;
function update(t){let dt=Math.min((t-last)/16||1,2);last=t;
 if(mode==='walk'){let dx=(on('right')?1:0)-(on('left')?1:0),dy=(on('down')?1:0)-(on('up')?1:0),n=Math.hypot(dx,dy)||1,v=on('run')?5:2.8;player.x+=dx/n*v*dt;player.y+=dy/n*v*dt;player.x=clamp(player.x,-1100,1100);player.y=clamp(player.y,-1100,1100);walk+=dt}
 if(mode==='drive'&&car){let acc=on('gas')||on('up'),br=on('brake')||on('down');car.speed=clamp(car.speed+(acc?.28:0)-(br?.65:.08)*dt,-4,8);if(on('left'))player.dir-=.04*dt;if(on('right'))player.dir+=.04*dt;car.x+=Math.sin(player.dir)*car.speed*dt;car.y-=Math.cos(player.dir)*car.speed*dt;player.x=car.x;player.y=car.y}
 if(dist(player,target)<55){cash+=1000;document.getElementById('money').textContent=cash.toLocaleString('en-NG');target={x:(Math.random()-.5)*1500,y:(Math.random()-.5)*1500};notice.textContent='Destination reached! ₦1,000 reward. Find the next marker.'}
 document.getElementById('mode').textContent=mode==='walk'?'ON FOOT':mode==='drive'?'DRIVING':'INSIDE';
 draw();requestAnimationFrame(update)}
requestAnimationFrame(update);
})();
</script></body></html>
